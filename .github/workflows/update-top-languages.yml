name: 更新语言统计卡片

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/scripts/generate_top_languages.py"
      - ".github/workflows/update-top-languages.yml"

permissions:
  contents: write

jobs:
  update-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: 生成语言统计卡片
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run --no-project python .github/scripts/generate_top_languages.py
      - name: 提交变化
        run: |
          if git diff --quiet -- assets/top-languages.svg; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/top-languages.svg
          git commit -m "自动更新语言统计卡片 [skip ci]"
          git push
